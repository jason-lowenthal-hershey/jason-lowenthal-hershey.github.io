<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not Found — Jason Lowenthal-Hershey</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <!-- 404.html keeps absolute /assets/ paths — GitHub Pages serves this for any
       unknown deep path, so relative paths could resolve below /assets. -->
  <style>
    .nf {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
    }
    .nf-code {
      font-family: 'Fraunces', serif;
      font-size: clamp(5rem, 18vw, 11rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--accent-hot));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0 0 0.5rem;
    }
    .nf h1 {
      font-size: clamp(1.4rem, 3vw, 2rem);
      margin-bottom: 1rem;
    }
    .nf p { max-width: 44ch; margin: 0 auto 2rem; }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <p class="nf-code">404</p>
      <h1>This page slipped the net.</h1>
      <p>The link you followed didn't land on anything I have. No hard feelings — let's get you back to the front page.</p>
      <a class="btn btn-primary" href="/">Take me home</a>
    </div>
  </main>
  <script src="/assets/js/main.js" defer></script>
</body>
</html>
